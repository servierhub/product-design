name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use stable Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          check-latest: true
      - name: Install user-context build dependencies
        run: npm ci --prefix skills/user-context
      - name: Run tests
        run: npm test
